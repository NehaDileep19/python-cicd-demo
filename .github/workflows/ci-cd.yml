deploy:
  needs: build-and-test

  runs-on: ubuntu-latest

  steps:
  - name: SSH Deploy
    uses: appleboy/ssh-action@v1.2.0
    with:
      host: ${{ secrets.HOST }}
      username: ubuntu
      key: ${{ secrets.SSH_PRIVATE_KEY }}

      script: |
        docker pull poojakdas/python-cicd-demo:latest
        docker stop python-app || true
        docker rm python-app || true
        docker run -d \
          --name python-app \
          -p 5000:5000 \
          poojakdas/python-cicd-demo:latest